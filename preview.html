<body class="site" data-page="files">

  <!-- Shared Navbar (Mounted by layout.component.js) -->
  <header class="nav"></header>

  <main>
    <section class="preview-section" id="previewSection">
      <div class="wrap">
        <div class="preview-topbar">
          <a href="files.html" class="btn btn-ghost btn-sm" data-nav-page="files" data-i18n="preview_back"></a>

          <div class="preview-nav-cluster">
            <button type="button" class="btn btn-ghost btn-sm" data-preview-step="-1" data-i18n="preview_prev"></button>
            <select class="preview-select" id="previewResourceSelect" aria-label="Select curriculum"></select>
            <button type="button" class="btn btn-ghost btn-sm" data-preview-step="1" data-i18n="preview_next"></button>
          </div>
        </div>

        <div class="preview-shell" id="filePreviewDialog">
          <div class="preview-meta-header">
            <div class="preview-title-row">
              <div class="preview-title-block">
                <div class="tags" id="previewTags"></div>
                <h1 class="h2" id="previewTitle"></h1>
                <p class="preview-desc-text" id="previewDesc"></p>
              </div>

              <div class="preview-actions-right">
                <button type="button" class="btn btn-ghost btn-sm" id="previewFocusBtn" data-i18n="preview_focus_enter"></button>
                <button type="button" class="preview-close" id="previewCloseBtn" hidden>×</button>
              </div>
            </div>

            <div class="preview-toolbar">
              <div class="preview-doc-tabs" role="tablist">
                <button type="button" class="preview-doc-tab active" id="tabProblemBtn" data-preview-tab="problem" data-i18n="preview_tab_problem"></button>
                <button type="button" class="preview-doc-tab" id="tabSolutionBtn" data-preview-tab="solution" data-i18n="preview_tab_solution"></button>
              </div>

              <div class="preview-actions-right">
                <a id="previewDownloadBtn" href="#" download class="btn btn-primary btn-sm" data-download-key=""></a>
                <span class="download-count" id="previewDownloadBadge" data-count-for="">↓ 0</span>
                <a id="previewExternalLink" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-ghost btn-sm"></a>
              </div>
            </div>
          </div>

          <div class="preview-body" id="previewBody"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Shared Footer (Mounted by layout.component.js) -->
  <footer class="foot"></footer>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
