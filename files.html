<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <!-- Content Security Policy — keep in sync across the 5 public pages -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.googletagmanager.com; frame-src 'self'; form-action 'self'">

  <!-- Early language & theme init — prevents an AR/light flash before first paint -->
  <script src="assets/js/early-init.js"></script>
  <meta name="description" content="SPhOH - Saudi Physics Olympiad Hub: A training resource and problem repository for advanced physics competitions and international olympiads.">
  <title>Problem Sets &amp; Solutions | SPhOH</title>

  <!-- Google Analytics — config lives in assets/js/analytics.js (CSP-safe, no inline code) -->
  <script src="assets/js/analytics.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-018KWMJE3F"></script>

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/png" href="assets/icons/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="shortcut icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/icons/site.webmanifest">
  <meta name="theme-color" content="#f6f3ec">

  <!-- Modular Application Scripts -->
  <script defer src="assets/js/config/settings.js"></script>
  <script defer src="assets/js/config/catalog.js"></script>
  <script defer src="assets/js/i18n/locales.js"></script>
  <script defer src="assets/js/core/dom.js"></script>
  <script defer src="assets/js/core/storage.js"></script>
  <script defer src="assets/js/services/state.service.js"></script>
  <script defer src="assets/js/services/i18n.service.js"></script>
  <script defer src="assets/js/services/theme.service.js"></script>
  <script defer src="assets/js/services/download.service.js"></script>
  <script defer src="assets/js/services/curriculum.service.js"></script>
  <script defer src="assets/js/components/toast.component.js"></script>
  <script defer src="assets/js/services/progress.service.js"></script>
  <script defer src="assets/js/services/effects.service.js"></script>
  <script defer src="assets/js/components/layout.component.js"></script>
  <script defer src="assets/js/components/card.component.js"></script>
  <script defer src="assets/js/pages/home.page.js"></script>
  <script defer src="assets/js/pages/files.page.js"></script>
  <script defer src="assets/js/pages/preview.page.js"></script>
  <script defer src="assets/js/pages/about.page.js"></script>
  <script defer src="assets/js/pages/contact.page.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>

<body class="site" data-page="files">

  <!-- Shared Navbar (Mounted by layout.component.js) -->
  <header class="nav"></header>

  <main id="main" tabindex="-1">
    <section class="page-header">
      <div class="wrap">
        <div class="eyebrow" data-i18n="files_eyebrow"></div>
        <h1 class="h2 mt-xs" data-i18n="files_title"></h1>
        <p class="lead mt-sm" data-i18n="files_desc"></p>

        <div class="translation-notice" role="note">
          <span class="notice-icon" aria-hidden="true">ℹ️</span>
          <p data-i18n="translation_notice"></p>
        </div>

        <div class="filter-bar">
          <div class="filter-chips" id="topicFilters" role="group" aria-label="Filter by topic" data-i18n-aria-label="filter_topic_aria"></div>
          <div class="filter-inputs">
            <select class="level-select" id="levelFilter" aria-label="Filter by difficulty level" data-i18n-aria-label="filter_level_aria"></select>
            <input type="search" class="search-input" id="searchInput" aria-label="Search problem sets" data-i18n-aria-label="search_sets_aria">
          </div>
        </div>
      </div>
    </section>

    <section class="block" id="files">
      <div class="wrap">
        <div class="count" id="count" aria-live="polite"></div>
        <div id="sectionsContainer"></div>
        <div class="empty" id="empty" hidden data-i18n="empty"></div>
      </div>
    </section>
  </main>

  <!-- Shared Footer (Mounted by layout.component.js) -->
  <footer class="foot"></footer>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
