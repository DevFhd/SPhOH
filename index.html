<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <!-- Content Security Policy — keep in sync across the 5 public pages -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://*.googletagmanager.com; frame-src 'self'; form-action 'self'">

  <!-- Early language & theme init — prevents an AR/light flash before first paint -->
  <script src="assets/js/early-init.js"></script>

  <meta name="description" content="SPhOH - Saudi Physics Olympiad Hub: A training resource and problem repository for advanced physics competitions and international olympiads.">
  <title>SPhOH — Saudi Physics Olympiad Hub</title>

  <!-- Google Analytics — config lives in assets/js/analytics.js (CSP-safe, no inline code) -->
  <script src="assets/js/analytics.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-018KWMJE3F"></script>

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Icons & Manifest -->
  <link rel="icon" type="image/png" href="assets/icons/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="shortcut icon" href="assets/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/icons/site.webmanifest">
  <meta name="theme-color" content="#f6f3ec">

  <!-- Modular Application Scripts -->
  <script defer src="assets/js/config/settings.js"></script>
  <script defer src="assets/js/config/catalog.js"></script>
  <script defer src="assets/js/i18n/locales.js"></script>
  <script defer src="assets/js/core/dom.js"></script>
  <script defer src="assets/js/core/storage.js"></script>
  <script defer src="assets/js/services/state.service.js"></script>
  <script defer src="assets/js/services/i18n.service.js"></script>
  <script defer src="assets/js/services/theme.service.js"></script>
  <script defer src="assets/js/services/download.service.js"></script>
  <script defer src="assets/js/services/curriculum.service.js"></script>
  <script defer src="assets/js/components/toast.component.js"></script>
  <script defer src="assets/js/services/progress.service.js"></script>
  <script defer src="assets/js/services/effects.service.js"></script>
  <script defer src="assets/js/components/layout.component.js"></script>
  <script defer src="assets/js/components/card.component.js"></script>
  <script defer src="assets/js/pages/home.page.js"></script>
  <script defer src="assets/js/pages/files.page.js"></script>
  <script defer src="assets/js/pages/preview.page.js"></script>
  <script defer src="assets/js/pages/about.page.js"></script>
  <script defer src="assets/js/pages/contact.page.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>

<body class="site" data-page="home">

  <!-- Shared Navbar (Mounted by layout.component.js) -->
  <header class="nav"></header>

  <main id="main" tabindex="-1">
    <!-- HERO -->
    <section class="block hero" id="home">
      <div class="wrap">
        <div class="hero-grid">
          <div>
            <div class="eyebrow" data-i18n="hero_eyebrow"></div>
            <h1 class="display mt-md" data-i18n="hero_title"></h1>
            <p class="lead mt-lg" data-i18n="hero_desc"></p>

            <div class="hero-actions">
              <a class="btn btn-primary" href="files.html">
                <span data-i18n="hero_cta"></span>
                <svg class="arrow" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                  <path d="M4 10h12m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
              <a class="btn btn-ghost" href="about.html" data-i18n="hero_secondary"></a>
            </div>
          </div>

          <div class="sketch">
            <svg viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="trajectoryGradient" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.45"/>
                  <stop offset="50%" stop-color="var(--accent)"/>
                  <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.45"/>
                </linearGradient>

                <filter id="trajectoryGlow" x="-20%" y="-30%" width="140%" height="160%">
                  <feGaussianBlur stdDeviation="5"/>
                </filter>
              </defs>

              <!-- Axes -->
              <line x1="40" y1="24" x2="40" y2="220" stroke="var(--line-strong)" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="40" y1="220" x2="420" y2="220" stroke="var(--line-strong)" stroke-width="1.5" stroke-linecap="round"/>
              <text x="24" y="18" fill="var(--muted)" font-size="11" font-family="'IBM Plex Mono', monospace">H</text>
              <text x="422" y="224" fill="var(--muted)" font-size="11" font-family="'IBM Plex Mono', monospace">R</text>

              <!-- Peak guides -->
              <line id="simPeakGuideH" x1="40" y1="133.8" x2="164.3" y2="133.8" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="4 5"/>
              <line id="simPeakGuideV" x1="164.3" y1="220" x2="164.3" y2="133.8" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="4 5"/>

              <!-- Soft trajectory glow -->
              <path
                id="simTrajectoryGlow"
                d="M40 220 Q164.3 47.5 288.6 220"
                fill="none"
                stroke="var(--accent)"
                stroke-width="9"
                stroke-linecap="round"
                opacity="0.35"
                filter="url(#trajectoryGlow)"
              />

              <!-- Main trajectory -->
              <path
                id="simTrajectoryPath"
                d="M40 220 Q164.3 47.5 288.6 220"
                fill="none"
                stroke="url(#trajectoryGradient)"
                stroke-width="3"
                stroke-linecap="round"
              />

              <circle cx="40" cy="220" r="3.5" fill="var(--accent)"/>
            </svg>
            <div class="cap">
              <span>R = v₀² sin 2θ / g</span>
              <span>H = v₀² sin²θ / 2g</span>
            </div>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="statSets">10</div>
            <div class="stat-label" data-i18n="stat_sets"></div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="statTopics">4</div>
            <div class="stat-label" data-i18n="stat_topics"></div>
          </div>
          <div class="stat-card">
            <div class="stat-value">AR / EN</div>
            <div class="stat-label" data-i18n="stat_bilingual"></div>
          </div>
          <div class="stat-card">
            <div class="stat-value">100%</div>
            <div class="stat-label" data-i18n="stat_free"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- METHODOLOGY PILLARS -->
    <section class="block band">
      <div class="wrap">
        <div class="eyebrow" data-i18n="pillars_eyebrow"></div>
        <h2 class="h2 mt-xs" data-i18n="pillars_title"></h2>

        <div class="pillars-cards">
          <div class="pillar-card">
            <i>I</i>
            <b data-i18n="p1_t"></b>
            <span data-i18n="p1_d"></span>
          </div>
          <div class="pillar-card">
            <i>II</i>
            <b data-i18n="p2_t"></b>
            <span data-i18n="p2_d"></span>
          </div>
          <div class="pillar-card">
            <i>III</i>
            <b data-i18n="p3_t"></b>
            <span data-i18n="p3_d"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- FEATURED PROBLEM SETS -->
    <section class="block">
      <div class="wrap">
        <div class="section-head-row">
          <div>
            <div class="eyebrow" data-i18n="featured_eyebrow"></div>
            <h2 class="h2 mt-xs" data-i18n="featured_title"></h2>
          </div>
          <a class="btn btn-ghost btn-sm" href="files.html" data-i18n="featured_all"></a>
        </div>
        <div class="grid" id="featuredContainer"></div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="block band" id="faq">
      <div class="wrap">
        <div class="eyebrow" data-i18n="faq_eyebrow"></div>
        <h2 class="h2 mt-xs" data-i18n="faq_title"></h2>
        <div class="faq-list" id="faqContainer"></div>
      </div>
    </section>
  </main>

  <!-- Shared Footer (Mounted by layout.component.js) -->
  <footer class="foot"></footer>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
