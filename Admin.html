<main>
<section class="page-header">
  <div class="wrap">
    <div class="eyebrow" data-i18n="admin_eyebrow"></div>
    <h1 class="h2" style="margin-top:10px" data-i18n="admin_title"></h1>
    <p class="lead" style="margin-top:12px" data-i18n="admin_desc"></p>
  </div>
</section>

<section class="block" id="adminSection">
  <div class="wrap">

    <!-- PASSWORD GATE -->
    <div class="admin-gate-wrap" id="adminLoginGate">
      <div class="admin-lock-badge" aria-hidden="true">🔐</div>
      <h2 class="h3" data-i18n="admin_gate_title"></h2>
      <p style="color:var(--muted);font-size:.92rem;margin:8px 0 0" data-i18n="admin_gate_desc"></p>

      <form class="admin-pass-form" id="adminLoginForm">
        <input type="password"
               class="admin-input admin-pass-input"
               id="adminPasswordInput"
               autocomplete="current-password"
               required
               aria-label="Admin Password">
        <div class="admin-error-msg" id="adminLoginError" hidden data-i18n="admin_wrong_pass"></div>
        <button type="submit" class="btn btn-primary" data-i18n="admin_login_btn"></button>
      </form>
    </div>

    <!-- UNLOCKED ADMIN DASHBOARD (SIMPLIFIED & DATABASE-READY) -->
    <div id="adminDashboard" hidden>

      <div class="admin-top-actions" style="max-width:860px;margin-inline:auto">
        <button type="button" class="btn btn-primary" id="openAddCurriculumBtn" data-i18n="admin_add_curriculum_btn"></button>
        <button type="button" class="btn btn-danger btn-sm" id="adminLogoutBtn" data-i18n="admin_logout_btn"></button>
      </div>

      <div class="admin-panel-grid">

        <!-- Collapsible Add / Edit Curriculum Drawer (Hidden until "➕ إضافة منهج جديد" or "✏️ تعديل" is clicked) -->
        <div class="admin-card admin-form-drawer" id="adminFormModalCard" hidden>
          <div class="admin-drawer-head">
            <h2 class="h3" id="adminFormHeading" data-i18n="admin_form_add_title"></h2>
            <button type="button" class="preview-close" id="adminCloseFormBtn" aria-label="Close">×</button>
          </div>

          <form class="admin-form-grid" id="adminResourceForm">
            <div class="admin-field">
              <label for="adminTopic" data-i18n="admin_lbl_topic"></label>
              <select class="admin-select" id="adminTopic" required></select>
            </div>

            <div class="admin-field">
              <label for="adminLevel" data-i18n="admin_lbl_level"></label>
              <select class="admin-select" id="adminLevel" required></select>
            </div>

            <!-- Brand-New Topic Creator (Appears when "➕ إضافة قسم / منهج جديد كلياً..." is selected) -->
            <div class="admin-new-topic-box" id="adminNewTopicBox" hidden>
              <div class="admin-field">
                <label for="adminNewTopicAr" data-i18n="admin_lbl_new_topic_ar"></label>
                <input type="text" class="admin-input" id="adminNewTopicAr" placeholder="مثال: الفيزياء الحديثة">
              </div>
              <div class="admin-field">
                <label for="adminNewTopicEn" data-i18n="admin_lbl_new_topic_en"></label>
                <input type="text" class="admin-input" id="adminNewTopicEn" placeholder="e.g. Modern Physics" dir="ltr">
              </div>
              <div class="admin-field">
                <label for="adminNewTopicKey" data-i18n="admin_lbl_new_topic_key"></label>
                <input type="text" class="admin-input" id="adminNewTopicKey" placeholder="modern" dir="ltr">
              </div>
            </div>

            <div class="admin-field">
              <label for="adminTitleAr" data-i18n="admin_lbl_title_ar"></label>
              <input type="text" class="admin-input" id="adminTitleAr" placeholder="مثال: النسبية الخاصة I" required>
            </div>

            <div class="admin-field">
              <label for="adminTitleEn" data-i18n="admin_lbl_title_en"></label>
              <input type="text" class="admin-input" id="adminTitleEn" placeholder="e.g. Special Relativity I" dir="ltr" required>
            </div>

            <div class="admin-field full">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
                <label for="adminFileStem" data-i18n="admin_lbl_stem"></label>
                <label class="btn btn-ghost btn-sm" style="cursor:pointer;padding:4px 10px;font-size:.8rem">
                  <span data-i18n="admin_lbl_pick_pdf"></span>
                  <input type="file" id="adminPdfFilePicker" accept=".pdf" hidden>
                </label>
              </div>
              <input type="text" class="admin-input" id="adminFileStem" placeholder="e.g. Relativity_I" dir="ltr" required>
              <div class="admin-hint" id="adminStemHint"></div>
            </div>

            <div class="admin-field full">
              <label for="adminDescAr" data-i18n="admin_lbl_desc_ar"></label>
              <textarea class="admin-textarea" id="adminDescAr" rows="2" placeholder="وصف مختصر للمنهج..." required></textarea>
            </div>

            <div class="admin-field full">
              <label for="adminDescEn" data-i18n="admin_lbl_desc_en"></label>
              <textarea class="admin-textarea" id="adminDescEn" rows="2" placeholder="Short curriculum description..." dir="ltr" required></textarea>
            </div>

            <div class="admin-field full">
              <label for="adminSolutionMode" data-i18n="admin_lbl_sol_mode"></label>
              <select class="admin-select" id="adminSolutionMode">
                <option value="none" data-i18n="admin_sol_none"></option>
                <option value="both" data-i18n="admin_sol_both"></option>
                <option value="ar" data-i18n="admin_sol_ar"></option>
                <option value="en" data-i18n="admin_sol_en"></option>
              </select>
            </div>

            <div class="admin-field full" style="display:flex;flex-direction:row;gap:10px;margin-top:6px">
              <button type="submit" class="btn btn-primary" style="flex:1" data-i18n="admin_save_btn"></button>
              <button type="button" class="btn btn-ghost" id="adminCancelEditBtn" data-i18n="admin_cancel_edit"></button>
            </div>
          </form>
        </div>

        <!-- Existing Curricula & One-Click Solution Toggles -->
        <div class="admin-card">
          <h2 class="h3" data-i18n="admin_list_title"></h2>
          <div class="admin-list" id="adminResourcesList"></div>
        </div>

      </div>

      <!-- Subtle Collapsible Database & JSON Sync Footer -->
      <details class="admin-db-tools">
        <summary data-i18n="admin_db_tools_summary"></summary>
        <div class="admin-db-tools-body">
          <button type="button" class="btn btn-primary btn-sm" id="adminExportJsonBtn" data-i18n="admin_export_json"></button>
          <button type="button" class="btn btn-ghost btn-sm" id="adminCopyJsonBtn" data-i18n="admin_copy_json"></button>
          <button type="button" class="btn btn-ghost btn-sm" id="adminResetDefaultBtn" data-i18n="admin_reset_default"></button>
        </div>
      </details>

    </div>

  </div>
</section>
